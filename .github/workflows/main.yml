name: build and publish v8 libs
on:
  push:
    tags:
      - 'v*'

env:
  V8_VERSION: "15.7.112.23"
  ANDROID_TEST_API: "23"
  # Match the NDK runtime pinned by this V8 version's DEPS, independent of the
  # runner image's changing ANDROID_NDK_LATEST_HOME.
  ANDROID_TEST_NDK_VERSION: "30.0.16248370"
  DEPOT_TOOLS_REPO: "https://chromium.googlesource.com/chromium/tools/depot_tools.git"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  create-release:
    name: create release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.release_id }}
    steps:
      - name: Create GitHub Release
        id: create_release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const body = [
              'V8 ${{ env.V8_VERSION }} Precompiled Static Libraries',
              '',
              '**Note: Please download the build artifacts below, DO NOT use Source code**',
              '',
              '## Supported Platforms',
              '',
              '### Android (arm64, arm, x64; Android 6.0 / API 23+)',
              '- Static library: `libv8_monolith-android-{arch}.zip`',
              '- Header files: `include-android.zip`',
              '- Each package includes: static library + args.gn + args.full.txt',
              '- 64-bit compatibility gates: 16 KB ELF alignment and a 16 KB emulator smoke test',
              '- Link the final application shared libraries with 16 KB alignment; package with AGP 8.5.1+',
              '',
              '### Windows (x64)',
              '- Static library: `libv8_monolith-win-x64-release.zip` (Release)',
              '- Static library: `libv8_monolith-win-x64-debug.zip` (Debug)',
              '- Header files: `include-win.zip`',
              '- Package includes: static library + args.gn + args.full.txt'
            ].join('\n');
            
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release-${tag}`,
              draft: true,
              prerelease: false,
              body: body
            });
            
            core.setOutput('upload_url', release.data.upload_url);
            core.setOutput('release_id', release.data.id);
            return release.data;

  build-android:
    name: android
    env:
      JOB_NAME: android
    needs: create-release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [arm64, arm, x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Prepare Android build environment
        run: |
          echo "::group::Prepare v8 build environment"
          git clone "$DEPOT_TOOLS_REPO"
          export PATH="$GITHUB_WORKSPACE/depot_tools:${PATH}"
          git clone --depth 1 --branch "$V8_VERSION" https://chromium.googlesource.com/v8/v8.git v8
          cd ${{ github.workspace }}/v8
          
          echo "Checkout v8 version: $V8_VERSION"
          git describe --tags --exact-match
          
          cat > ${{ github.workspace }}/.gclient << 'EOF'
          solutions = [
            {
              "name": "v8",
              "url": "https://chromium.googlesource.com/v8/v8.git",
              "managed": False,
              "custom_deps": {
                "v8/test/benchmarks/data": None,
                "v8/test/mozilla/data": None,
                "v8/test/test262/data": None,
                "v8/test/wasm-js/data": None,
              },
            },
          ]
          target_os = ['android']
          EOF

          echo "Running version-pinned gclient sync without hooks..."
          gclient sync --nohooks -D --force --reset --shallow --no-history --revision "v8@refs/tags/$V8_VERSION"
          ./build/install-build-deps.sh --no-prompt --no-chromeos-fonts --android

          if [[ "${{ matrix.platform }}" == "arm" ]]; then
            sudo apt-get install -y libatomic1:i386
          fi
          gclient runhooks
          echo "::endgroup::"
      - name: Compile Android static library
        env:
          PLATFORM: ${{ matrix.platform }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          export PATH="$GITHUB_WORKSPACE/depot_tools:${PATH}"
          cd "$GITHUB_WORKSPACE/v8"
          echo "::group::Run pre-build script"
          node ${{ github.workspace }}/builder.js
          echo "::endgroup::"
          echo "::group::Compile v8 static library"
          mkdir -p out.gn/android.${{ matrix.platform }}.release/
          cp ${{ github.workspace }}/args.android.${{ matrix.platform }}.gn ${{ github.workspace }}/v8/out.gn/android.${{ matrix.platform }}.release/args.gn
          # Install after all sync/hooks, at the point where GN needs these host sysroots.
          install_host_sysroot() {
            local arch="$1"
            local triplet="$2"
            local sysroot="$GITHUB_WORKSPACE/v8/build/linux/debian_bullseye_${arch}-sysroot"
            python3 "$GITHUB_WORKSPACE/v8/build/linux/sysroot_scripts/install-sysroot.py" --arch="$arch"
            for required_file in usr/include/features.h "usr/lib/$triplet/crt1.o" "usr/lib/$triplet/libc.so"; do
              if [[ ! -f "$sysroot/$required_file" ]]; then
                echo "::error::Incomplete $arch host sysroot: $sysroot/$required_file"
                exit 1
              fi
            done
            echo "Verified $arch host sysroot: $sysroot"
          }
          install_host_sysroot amd64 x86_64-linux-gnu
          if [[ "${{ matrix.platform }}" == "arm" ]]; then
            install_host_sysroot i386 i386-linux-gnu
          fi
          gn gen --fail-on-unused-args out.gn/android.${{ matrix.platform }}.release
          ninja -j 2 v8_monolith -C out.gn/android.${{ matrix.platform }}.release/
          gn args --list out.gn/android.${{ matrix.platform }}.release > out.gn/android.${{ matrix.platform }}.release/args.full.txt
          echo "::endgroup::"
          echo "::group::Compress artifacts"
          zip -j ../libv8_monolith-${{ env.JOB_NAME }}-${{ matrix.platform }}.zip \
            out.gn/android.${{ matrix.platform }}.release/obj/libv8_monolith.a \
            out.gn/android.${{ matrix.platform }}.release/args.gn \
            out.gn/android.${{ matrix.platform }}.release/args.full.txt
          if [ "${{ matrix.platform }}" = "arm64" ]; then
            zip -r ../include-${{ env.JOB_NAME }}.zip include
          fi
          ls -a
          echo "::endgroup::"
      - name: Select matching Android test NDK
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          ndk_root="$sdk_root/ndk/$ANDROID_TEST_NDK_VERSION"
          if [[ ! -f "$ndk_root/source.properties" ]]; then
            sdkmanager --install "ndk;$ANDROID_TEST_NDK_VERSION"
          fi
          ndk_revision="$(sed -n 's/^Pkg.Revision[[:space:]]*=[[:space:]]*//p' "$ndk_root/source.properties")"
          test "$ndk_revision" = "$ANDROID_TEST_NDK_VERSION"
          echo "V8_TEST_NDK=$ndk_root" >> "$GITHUB_ENV"
          cat "$ndk_root/source.properties"
      - name: Link and inspect Android 6.0 and 16 KB compatibility
        run: |
          artifact_root="$RUNNER_TEMP/v8-smoke-artifacts"
          v8_out="$GITHUB_WORKSPACE/v8/out.gn/android.${{ matrix.platform }}.release"
          mkdir -p "$artifact_root/headers" "$artifact_root/${{ matrix.platform }}"
          cp -R "$GITHUB_WORKSPACE/v8/include" "$artifact_root/headers/"
          cp "$v8_out/obj/libv8_monolith.a" "$v8_out/args.gn" "$v8_out/args.full.txt" "$artifact_root/${{ matrix.platform }}/"
          python3 tests/android/run_smoke.py \
            --artifacts "$artifact_root" \
            --ndk "$V8_TEST_NDK" \
            --runtime-ndk "$GITHUB_WORKSPACE/v8/third_party/android_toolchain/ndk" \
            --arch "${{ matrix.platform }}" --api "$ANDROID_TEST_API" --build-only
      - name: Enable KVM for Android 6.0 emulator
        if: matrix.platform == 'x64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run smoke test on Android 6.0
        if: matrix.platform == 'x64'
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_TEST_API }}
          target: default
          arch: x86_64
          avd-name: v8-api23
          emulator-port: 5554
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            test "$(adb -s "emulator-$EMULATOR_PORT" shell getprop ro.build.version.sdk | tr -d '\r')" = "$ANDROID_TEST_API"
            python3 tests/android/run_smoke.py --artifacts "$RUNNER_TEMP/v8-smoke-artifacts" --ndk "$V8_TEST_NDK" --runtime-ndk "$GITHUB_WORKSPACE/v8/third_party/android_toolchain/ndk" --arch x64 --api "$ANDROID_TEST_API" --serial "emulator-$EMULATOR_PORT" --page-size 4096
      - name: Run smoke test on Android 16 KB pages
        if: matrix.platform == 'x64'
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          avd-name: v8-16k
          emulator-port: 5556
          ram-size: 4096M
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python3 tests/android/run_smoke.py --artifacts "$RUNNER_TEMP/v8-smoke-artifacts" --ndk "$V8_TEST_NDK" --runtime-ndk "$GITHUB_WORKSPACE/v8/third_party/android_toolchain/ndk" --arch x64 --api "$ANDROID_TEST_API" --serial "emulator-$EMULATOR_PORT" --page-size 16384 --output build/android-smoke/x64-16k
      - name: Upload Android compatibility logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-compatibility-${{ matrix.platform }}
          path: build/android-smoke/**/smoke.log
          if-no-files-found: ignore
      - name: Upload static library
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/libv8_monolith-${{ env.JOB_NAME }}-${{ matrix.platform }}.zip
          asset_name: libv8_monolith-${{ env.JOB_NAME }}-${{ matrix.platform }}.zip
          asset_content_type: application/zip
      - name: Upload include
        if: matrix.platform == 'arm64'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/include-${{ env.JOB_NAME }}.zip
          asset_name: include-${{ env.JOB_NAME }}.zip
          asset_content_type: application/zip

  build-apple:
    # Temporarily paused while Android and Windows builds are stabilized.
    if: false
    name: apple
    env:
      JOB_NAME: apple
    needs: create-release
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare v8 environment
        run: |
          echo "::group::Prepare v8 build environment"
          git clone "$DEPOT_TOOLS_REPO"
          export PATH="$GITHUB_WORKSPACE/depot_tools:${PATH}"
          git clone --depth 1 --branch "$V8_VERSION" https://chromium.googlesource.com/v8/v8.git v8
          cd ${{ github.workspace }}/v8

          echo "Checkout v8 version: $V8_VERSION"
          git describe --tags --exact-match

          cat > ${{ github.workspace }}/.gclient << 'EOF'
          solutions = [
            {
              "name": "v8",
              "url": "https://chromium.googlesource.com/v8/v8.git",
              "managed": False,
              "custom_deps": {
                "v8/test/benchmarks/data": None,
                "v8/test/mozilla/data": None,
                "v8/test/test262/data": None,
                "v8/test/wasm-js/data": None,
              },
            },
          ]
          target_os = ['ios']
          EOF

          echo "Running gclient sync with dependencies..."
          gclient sync -D --force --reset --shallow --no-history --revision "v8@refs/tags/$V8_VERSION"
          echo "::endgroup::"
      - name: Build iOS arm64 (device)
        env:
          PLATFORM: arm64
          JOB_NAME: ios
          WORKSPACE: ${{ github.workspace }}
        run: |
          export PATH="$GITHUB_WORKSPACE/depot_tools:${PATH}"
          cd ${{ github.workspace }}/v8
          echo "::group::Run pre-build script for ios arm64"
          node ${{ github.workspace }}/builder.js
          echo "::endgroup::"
          echo "::group::Compile v8 static library for iOS arm64 (device)"
          mkdir -p out.gn/ios.arm64.release/
          cp ${{ github.workspace }}/args.ios.arm64.gn out.gn/ios.arm64.release/args.gn
          gn gen --fail-on-unused-args out.gn/ios.arm64.release
          ninja v8_monolith -C out.gn/ios.arm64.release/
          gn args --list out.gn/ios.arm64.release > out.gn/ios.arm64.release/args.full.txt
          echo "::endgroup::"
      - name: Build iOS arm64 (simulator)
        env:
          PLATFORM: arm64.simulator
          JOB_NAME: ios
          WORKSPACE: ${{ github.workspace }}
        run: |
          export PATH="$GITHUB_WORKSPACE/depot_tools:${PATH}"
          cd ${{ github.workspace }}/v8
          echo "::group::Run pre-build script for ios arm64.simulator"
          node ${{ github.workspace }}/builder.js
          echo "::endgroup::"
          echo "::group::Compile v8 static library for iOS arm64 (simulator)"
          mkdir -p out.gn/ios.arm64.simulator.release/
          cp ${{ github.workspace }}/args.ios.arm64.simulator.gn out.gn/ios.arm64.simulator.release/args.gn
          gn gen --fail-on-unused-args out.gn/ios.arm64.simulator.release
          ninja v8_monolith -C out.gn/ios.arm64.simulator.release/
          gn args --list out.gn/ios.arm64.simulator.release > out.gn/ios.arm64.simulator.release/args.full.txt
          echo "::endgroup::"
      - name: Build macOS arm64
        env:
          PLATFORM: arm64
          JOB_NAME: mac
          WORKSPACE: ${{ github.workspace }}
        run: |
          export PATH="$GITHUB_WORKSPACE/depot_tools:${PATH}"
          cd ${{ github.workspace }}/v8
          echo "::group::Run pre-build script for macOS arm64"
          node ${{ github.workspace }}/builder.js
          echo "::endgroup::"
          echo "::group::Compile v8 static library for macOS arm64"
          mkdir -p out.gn/mac.arm64.release/
          cp ${{ github.workspace }}/args.mac.arm64.gn out.gn/mac.arm64.release/args.gn
          gn gen --fail-on-unused-args out.gn/mac.arm64.release
          ninja v8_monolith -C out.gn/mac.arm64.release/
          gn args --list out.gn/mac.arm64.release > out.gn/mac.arm64.release/args.full.txt
          echo "::endgroup::"
      - name: Create XCFramework
        run: |
          cd ${{ github.workspace }}/v8
          echo "::group::Assemble per-slice frameworks"

          assemble_slice() {
            local slice_dir="$1"   # e.g. ios-arm64
            local out_dir="$2"     # e.g. out.gn/ios.arm64.release
            local fw="frameworks/${slice_dir}/libv8_monolith.framework"
            mkdir -p "${fw}/Headers"
            cp "${out_dir}/obj/libv8_monolith.a" "${fw}/libv8_monolith"
            # Copy source headers first
            cp -R include/. "${fw}/Headers/"
            # Overlay generated headers tied to this slice's gn args (v8config.h etc.)
            if [ -d "${out_dir}/gen/include" ]; then
              cp -R "${out_dir}/gen/include/." "${fw}/Headers/"
            fi
            sed "s/V8_VERSION_PLACEHOLDER/${{ env.V8_VERSION }}/g" \
              ${{ github.workspace }}/Info.plist.template > "${fw}/Info.plist"
          }

          assemble_slice "ios-arm64"           "out.gn/ios.arm64.release"
          assemble_slice "ios-arm64-simulator" "out.gn/ios.arm64.simulator.release"
          assemble_slice "macos-arm64"         "out.gn/mac.arm64.release"
          echo "::endgroup::"

          echo "::group::Create XCFramework (ios device + ios simulator + macOS)"
          xcodebuild -create-xcframework \
            -framework frameworks/ios-arm64/libv8_monolith.framework \
            -framework frameworks/ios-arm64-simulator/libv8_monolith.framework \
            -framework frameworks/macos-arm64/libv8_monolith.framework \
            -output libv8_monolith.xcframework

          echo "XCFramework structure:"
          ls -R libv8_monolith.xcframework
          echo ""
          echo "XCFramework top-level Info.plist (auto-generated by xcodebuild):"
          cat libv8_monolith.xcframework/Info.plist
          echo "::endgroup::"

          echo "::group::Compress artifacts"
          zip -r ../libv8_monolith-${{ env.JOB_NAME }}.zip \
            libv8_monolith.xcframework \
            out.gn/ios.arm64.release/args.gn \
            out.gn/ios.arm64.release/args.full.txt \
            out.gn/ios.arm64.simulator.release/args.gn \
            out.gn/ios.arm64.simulator.release/args.full.txt \
            out.gn/mac.arm64.release/args.gn \
            out.gn/mac.arm64.release/args.full.txt
          ls -lh ../libv8_monolith-${{ env.JOB_NAME }}.zip
          echo "::endgroup::"
      - name: Upload XCFramework
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/libv8_monolith-${{ env.JOB_NAME }}.zip
          asset_name: libv8_monolith-${{ env.JOB_NAME }}.zip
          asset_content_type: application/zip

  build-win:
    name: windows
    env:
      JOB_NAME: win
    needs: create-release
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64]
        build_type: [release, debug]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Windows SDK 10.0.28000.0
        shell: pwsh
        run: |
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $header = "$sdkRoot\Include\10.0.28000.0\um\Windows.h"
          $library = "$sdkRoot\Lib\10.0.28000.0\um\x64\kernel32.lib"
          $debugger = "$sdkRoot\Debuggers\x64\cdb.exe"
          if (!(Test-Path $header) -or !(Test-Path $library) -or !(Test-Path $debugger)) {
            # V8's pinned build/vs_toolchain.py requires this SDK, absent from the runner.
            $installer = Join-Path $env:RUNNER_TEMP "winsdksetup.exe"
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2370315" -OutFile $installer
            $arguments = "/quiet /norestart /ceip off /features OptionId.DesktopCPPx64 OptionId.DesktopCPPx86 OptionId.WindowsDesktopDebuggers"
            $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Windows SDK installation failed: $($process.ExitCode)"
            }
          }
          if (!(Test-Path $header) -or !(Test-Path $library) -or !(Test-Path $debugger)) {
            throw "Windows SDK 10.0.28000.0 is incomplete"
          }
      - name: setup env
        shell: pwsh
        run: |
          echo "${{ github.workspace }}/depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: prepared v8 build environment
        run: |
          echo "::group::Prepare v8 build environment"
          git config --global depot-tools.allowGlobalGitConfig true
          git config --global core.longpaths true
          git clone "$DEPOT_TOOLS_REPO"
          git clone --depth 1 --branch "$V8_VERSION" https://chromium.googlesource.com/v8/v8.git v8
          cd v8
          
          echo "Checkout v8 version: $V8_VERSION"
          git describe --tags --exact-match
          
          cat > ../.gclient << 'EOF'
          solutions = [
            {
              "name": "v8",
              "url": "https://chromium.googlesource.com/v8/v8.git",
              "managed": False,
              "custom_deps": {
                "v8/test/benchmarks/data": None,
                "v8/test/mozilla/data": None,
                "v8/test/test262/data": None,
                "v8/test/wasm-js/data": None,
              },
            },
          ]
          EOF
          
          echo "Running gclient sync with dependencies..."
          gclient sync -D --force --reset --shallow --no-history --revision "v8@refs/tags/$V8_VERSION"
          echo "::endgroup::"
      - name: run pre-build script
        env:
          PLATFORM: ${{ matrix.platform }}
          JOB_NAME: ${{ env.JOB_NAME }}
          WORKSPACE: ${{ github.workspace }}
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          echo "::group::Run pre-build script"
          node builder.js
          echo "::endgroup::"
      - name: compile v8 static library
        shell: pwsh
        run: |
          echo "::group::Compile v8 static library"
          New-Item -ItemType directory -Path v8/out.gn/win.${{ matrix.platform }}.${{ matrix.build_type }}/
          Copy-Item "args.win.${{ matrix.platform }}.${{ matrix.build_type }}.gn" -Destination "v8/out.gn/win.${{ matrix.platform }}.${{ matrix.build_type }}/args.gn" -force
          Set-Location -Path v8
          gn gen --fail-on-unused-args out.gn/win.${{ matrix.platform }}.${{ matrix.build_type }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ninja v8_monolith -C out.gn/win.${{ matrix.platform }}.${{ matrix.build_type }}/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gn args --list out.gn/win.${{ matrix.platform }}.${{ matrix.build_type }} > out.gn/win.${{ matrix.platform }}.${{ matrix.build_type }}/args.full.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "::endgroup::"
      - name: compress artifacts
        shell: pwsh
        run: |
          echo "::group::Compress artifacts"
          Compress-Archive -Path @(
            "${{ github.workspace }}/v8/out.gn/win.${{ matrix.platform }}.${{ matrix.build_type }}/obj/v8_monolith.lib",
            "${{ github.workspace }}/v8/out.gn/win.${{ matrix.platform }}.${{ matrix.build_type }}/args.gn",
            "${{ github.workspace }}/v8/out.gn/win.${{ matrix.platform }}.${{ matrix.build_type }}/args.full.txt"
          ) -Destination ${{ github.workspace }}/libv8_monolith-${{ env.JOB_NAME }}-${{ matrix.platform }}-${{ matrix.build_type }}.zip
          if ("${{ matrix.platform }}" -eq "x64" -and "${{ matrix.build_type }}" -eq "release") {
            Compress-Archive -Path ${{ github.workspace }}/v8/include -Destination ${{ github.workspace }}/include-${{ env.JOB_NAME }}.zip
          }
          echo "::endgroup::"
      - name: Upload static library
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/libv8_monolith-${{ env.JOB_NAME }}-${{ matrix.platform }}-${{ matrix.build_type }}.zip
          asset_name: libv8_monolith-${{ env.JOB_NAME }}-${{ matrix.platform }}-${{ matrix.build_type }}.zip
          asset_content_type: application/zip
      - name: Upload include
        if: matrix.platform == 'x64' && matrix.build_type == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}/include-${{ env.JOB_NAME }}.zip
          asset_name: include-${{ env.JOB_NAME }}.zip
          asset_content_type: application/zip

  publish-release:
    name: publish release
    needs: [build-android, build-win]
    runs-on: ubuntu-latest
    steps:
    - name: Publish Release
      uses: actions/github-script@v7
      with:
        script: |
          const tag = context.ref.replace('refs/tags/', '');
          const releases = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          const release = releases.data.find(r => r.tag_name === tag);
          if (release) {
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false
            });
            console.log('Release published successfully');
          }
